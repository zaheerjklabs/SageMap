<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090A0F" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Hexagon Base -->
  <rect width="240" height="240" rx="48" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="3" />
  
  <!-- Outer Glow Hex Shield -->
  <path d="M120 28 L196 72 L196 168 L120 212 L44 168 L44 72 Z" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6 4" opacity="0.4" />

  <!-- Road / Node Path Connections -->
  <!-- Main Backbone Spine -->
  <path d="M120 54 L120 186" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glowGold)" />
  
  <!-- Diagonal Synapses / Branch Nodes -->
  <path d="M120 82 L72 118 L72 152" stroke="url(#cyanGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowCyan)" />
  <path d="M120 120 L168 156 L168 174" stroke="url(#purpleGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M72 152 L120 186" stroke="url(#cyanGrad)" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  
  <!-- Cross Connectors -->
  <path d="M72 118 L168 156" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Core Graph Nodes -->
  <!-- Top Node (Foundations) -->
  <circle cx="120" cy="54" r="12" fill="#0F172A" stroke="url(#goldGrad)" stroke-width="3.5" filter="url(#glowGold)" />
  <circle cx="120" cy="54" r="5" fill="#F59E0B" />

  <!-- Center Hub Node (Neural / Core ML) -->
  <circle cx="120" cy="120" r="15" fill="#090A0F" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glowGold)" />
  <circle cx="120" cy="120" r="6" fill="#FDE68A" />

  <!-- Left Branch Node (Data & Deep Learning) -->
  <circle cx="72" cy="118" r="10" fill="#0F172A" stroke="url(#cyanGrad)" stroke-width="3" filter="url(#glowCyan)" />
  <circle cx="72" cy="118" r="4" fill="#06B6D4" />

  <!-- Left Lower Node (Agentic Systems) -->
  <circle cx="72" cy="152" r="8" fill="#0F172A" stroke="url(#cyanGrad)" stroke-width="2.5" />
  <circle cx="72" cy="152" r="3" fill="#22D3EE" />

  <!-- Right Branch Node (LLMs & Optimization) -->
  <circle cx="168" cy="156" r="10" fill="#0F172A" stroke="url(#purpleGrad)" stroke-width="3" />
  <circle cx="168" cy="156" r="4" fill="#8B5CF6" />

  <!-- Bottom Terminal Node (Production & MLOps) -->
  <circle cx="120" cy="186" r="13" fill="#0F172A" stroke="url(#goldGrad)" stroke-width="3.5" filter="url(#glowGold)" />
  <circle cx="120" cy="186" r="5.5" fill="#F59E0B" />
  
  <!-- Subtle Pulse Rings -->
  <circle cx="120" cy="120" r="22" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.3" stroke-dasharray="3 3" />
</svg>
