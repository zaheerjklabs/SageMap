<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="45%" stop-color="#090A0F" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FDE68A" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="nodeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glowG" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#334155" opacity="0.6" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="480" fill="url(#bgGrad)" />
  <rect width="1200" height="480" fill="url(#cyberGrid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="120" r="180" fill="#F59E0B" opacity="0.08" filter="url(#glowG)" />
  <circle cx="1050" cy="240" r="220" fill="#06B6D4" opacity="0.08" filter="url(#glowG)" />
  <circle cx="600" cy="420" r="150" fill="#8B5CF6" opacity="0.06" filter="url(#glowG)" />

  <!-- Outer Border Frame -->
  <rect x="12" y="12" width="1176" height="456" rx="28" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- ======================================================== -->
  <!-- LEFT COLUMN: BRANDING & HEADLINE -->
  <!-- ======================================================== -->
  <g transform="translate(60, 70)">
    <!-- Brand Badge -->
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#0D1117" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="16" cy="16" r="4" fill="#F59E0B" />
    <text x="30" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FDE68A" letter-spacing="1.5">ZAHEERJKLABS · 2026</text>

    <!-- Main Title -->
    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="url(#goldTextGrad)" letter-spacing="-1.5">
      SageMap
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#E2E8F0" letter-spacing="0.2">
      Navigate. Master. Build.
    </text>
    
    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">
      The Interactive AI, Machine Learning &amp; Deep Learning Roadmap
    </text>

    <!-- Feature Pill Badges -->
    <g transform="translate(0, 205)">
      <!-- Badge 1: Interactive Canvas -->
      <rect x="0" y="0" width="168" height="34" rx="10" fill="#0D1117" stroke="#334155" stroke-width="1.2" />
      <circle cx="16" cy="17" r="4" fill="#F59E0B" />
      <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#F1F5F9">Interactive DAG Canvas</text>

      <!-- Badge 2: Realtime Cloud -->
      <rect x="178" y="0" width="162" height="34" rx="10" fill="#0D1117" stroke="#334155" stroke-width="1.2" />
      <circle cx="194" cy="17" r="4" fill="#06B6D4" />
      <text x="206" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#F1F5F9">Realtime Cloud Sync</text>

      <!-- Badge 3: Curated Resources -->
      <rect x="350" y="0" width="154" height="34" rx="10" fill="#0D1117" stroke="#334155" stroke-width="1.2" />
      <circle cx="366" cy="17" r="4" fill="#8B5CF6" />
      <text x="378" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#F1F5F9">Curated Catalog</text>
    </g>

    <!-- Live URL Pill -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="310" height="38" rx="12" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-opacity="0.5" stroke-width="1.5" />
      <text x="18" y="23" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" font-weight="700" fill="#FDE68A">
        https://sage-map-six.vercel.app
      </text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- RIGHT COLUMN: VISUAL ROADMAP FLOW GRAPH -->
  <!-- ======================================================== -->
  <g transform="translate(630, 45)">
    <!-- Canvas Window Frame Mockup -->
    <rect x="0" y="0" width="510" height="390" rx="20" fill="#0D1117" stroke="#1E293B" stroke-width="2" />
    
    <!-- Window Title Bar -->
    <rect x="0" y="0" width="510" height="38" rx="20" fill="#090A0F" />
    <path d="M0 20 L0 38 L510 38 L510 20 Z" fill="#090A0F" />
    <line x1="0" y1="38" x2="510" y2="38" stroke="#1E293B" stroke-width="1.5" />
    
    <!-- Window Traffic Lights -->
    <circle cx="20" cy="19" r="5" fill="#EF4444" opacity="0.8" />
    <circle cx="36" cy="19" r="5" fill="#F59E0B" opacity="0.8" />
    <circle cx="52" cy="19" r="5" fill="#10B981" opacity="0.8" />
    <text x="75" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#64748B">SageMap Flow Canvas · 18 Master Steps</text>

    <!-- Glowing Connecting Pipeline Lines -->
    <path d="M 120 100 L 255 100 L 255 180 L 390 180" fill="none" stroke="url(#lineGrad)" stroke-width="3" filter="url(#glowSubtle)" />
    <path d="M 255 180 L 120 260 L 255 330 L 390 330" fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-dasharray="6 4" />

    <!-- Node 1: STEP 01 - Python & Math -->
    <g transform="translate(45, 68)">
      <rect width="150" height="64" rx="14" fill="#090A0F" stroke="#F59E0B" stroke-width="2" />
      <rect x="8" y="8" width="46" height="16" rx="6" fill="#F59E0B" fill-opacity="0.2" />
      <text x="14" y="20" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" fill="#FDE68A">STEP 01</text>
      <text x="8" y="42" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">Python Foundations</text>
      <text x="8" y="55" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#94A3B8">OOP, Async, Typing</text>
    </g>

    <!-- Node 2: STEP 05 - Classical ML -->
    <g transform="translate(180, 148)">
      <rect width="150" height="64" rx="14" fill="#090A0F" stroke="#06B6D4" stroke-width="2" />
      <rect x="8" y="8" width="46" height="16" rx="6" fill="#06B6D4" fill-opacity="0.2" />
      <text x="14" y="20" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" fill="#67E8F9">STEP 05</text>
      <text x="8" y="42" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">Classical ML Models</text>
      <text x="8" y="55" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#94A3B8">Regression, Trees, SVM</text>
    </g>

    <!-- Node 3: STEP 08 - Transformers & LLMs -->
    <g transform="translate(315, 148)">
      <rect width="150" height="64" rx="14" fill="#090A0F" stroke="#8B5CF6" stroke-width="2" />
      <rect x="8" y="8" width="46" height="16" rx="6" fill="#8B5CF6" fill-opacity="0.2" />
      <text x="14" y="20" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" fill="#C4B5FD">STEP 08</text>
      <text x="8" y="42" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">Transformers &amp; LLMs</text>
      <text x="8" y="55" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#94A3B8">Self-Attention, BERT</text>
    </g>

    <!-- Node 4: STEP 12 - Agentic Systems -->
    <g transform="translate(45, 230)">
      <rect width="150" height="64" rx="14" fill="#090A0F" stroke="#10B981" stroke-width="2" />
      <rect x="8" y="8" width="46" height="16" rx="6" fill="#10B981" fill-opacity="0.2" />
      <text x="14" y="20" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" fill="#6EE7B7">STEP 12</text>
      <text x="8" y="42" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">Agentic AI &amp; Tools</text>
      <text x="8" y="55" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#94A3B8">LangGraph, ReAct</text>
    </g>

    <!-- Node 5: STEP 18 - MLOps & Production -->
    <g transform="translate(315, 300)">
      <rect width="150" height="64" rx="14" fill="#090A0F" stroke="#F59E0B" stroke-width="2" />
      <rect x="8" y="8" width="46" height="16" rx="6" fill="#F59E0B" fill-opacity="0.2" />
      <text x="14" y="20" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" fill="#FDE68A">STEP 18</text>
      <text x="8" y="42" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">MLOps &amp; Inference</text>
      <text x="8" y="55" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#94A3B8">Docker, Triton, vLLM</text>
    </g>
  </g>
</svg>
